[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crack-fracture-cae"
version = "2.0.0"
description = "Scale-invariant hybrid (physics + neural) CAE engine for quasi-brittle fracture: Brazilian disc splitting, Mazars damage, matrix-free PCG, Germano self-supervised closure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
crack-cae = "src.cli:crack_v2"
crack-cae-v1 = "src.cli:crack_v1"
crack-pcg-demo = "src.cli:pcg_demo"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "FEA*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
# Line length is deliberately relaxed for numeric/one-per-line-heavy code.
# E701/E702 (multiple statements per line) remain enabled for the shared
# library (src/) but are tolerated in legacy driver scripts under solvers/
# until the P0-1 single-implementation refactor rewrites them.
extend-ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/solvers/*.py" = ["E701", "E702"]
"src/experimental/*.py" = ["E701", "E702", "E402"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/cli.py",
    "src/pcg_demo.py",
    "src/solver.py",
    "src/solvers/*",
    "src/experimental/*",
]
